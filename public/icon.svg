<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="chassisGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0e5ec"/>
      <stop offset="100%" stop-color="#babecc"/>
    </radialGradient>
    <radialGradient id="buttonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="50%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#d63031"/>
    </radialGradient>
    <filter id="outerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="12" stdDeviation="16" flood-color="#babecc" flood-opacity="0.9"/>
      <feDropShadow dx="-12" dy="-12" stdDeviation="16" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Chassis Surface -->
  <rect width="512" height="512" rx="96" fill="#e0e5ec"/>

  <!-- Corner Screws -->
  <circle cx="48" cy="48" r="10" fill="#babecc" stroke="#ffffff" stroke-width="2"/>
  <line x1="42" y1="48" x2="54" y2="48" stroke="#4a5568" stroke-width="2"/>
  
  <circle cx="464" cy="48" r="10" fill="#babecc" stroke="#ffffff" stroke-width="2"/>
  <line x1="458" y1="48" x2="470" y2="48" stroke="#4a5568" stroke-width="2"/>

  <circle cx="48" cy="464" r="10" fill="#babecc" stroke="#ffffff" stroke-width="2"/>
  <line x1="44" y1="460" x2="52" y2="468" stroke="#4a5568" stroke-width="2"/>

  <circle cx="464" cy="464" r="10" fill="#babecc" stroke="#ffffff" stroke-width="2"/>
  <line x1="460" y1="468" x2="468" y2="460" stroke="#4a5568" stroke-width="2"/>

  <!-- Outer Recessed Well -->
  <circle cx="256" cy="256" r="185" fill="#d1d9e6" stroke="#babecc" stroke-width="4"/>
  <circle cx="256" cy="256" r="170" fill="url(#chassisGrad)" filter="url(#outerShadow)"/>

  <!-- Inner Braun Safety Red Dome -->
  <circle cx="256" cy="256" r="130" fill="url(#buttonGrad)"/>

  <!-- Safety Shield Symbol -->
  <path d="M256 160 L320 188 V250 C320 295 292 332 256 348 C220 332 192 295 192 250 V188 Z" 
        fill="#ffffff" 
        opacity="0.95"/>
        
  <!-- Beacon / Lightning Bolt inside Shield -->
  <path d="M262 196 L232 250 H260 L248 304 L284 242 H254 Z" 
        fill="#ff4757"/>

  <!-- Operational LED Status Dot -->
  <circle cx="256" cy="96" r="8" fill="#10b981" filter="url(#glow)"/>
</svg>
